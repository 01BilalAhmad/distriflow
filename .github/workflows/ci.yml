# DistriFlow CI — skills-audit 2026-10
# Pipeline design per audit Finding 2-d#2: explicit gates for lint / typecheck / test / build.
# NOTE (typecheck + build + audit): jobs marked continue-on-error until the baseline
# errors documented in the audit report are fixed — flip to strict afterwards.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    # next.config.ts sets typescript.ignoreBuildErrors=true, so `next build`
    # will NOT catch type errors — this explicit job is the only net.
    continue-on-error: true # TODO: remove after fixing the type baseline (audit Finding 2-c#3)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run vitest (graceful skip until vitest is installed — see docs/TESTING.md)
        run: |
          if npx --no-install vitest --version >/dev/null 2>&1; then
            npx vitest run
          else
            echo "::warning::vitest devDependency not installed yet — see docs/TESTING.md"
          fi

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    # Prerendering may touch DB-dependent pages; a dummy URL keeps prisma happy.
    # Flip continue-on-error off once the first green run is observed.
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # make blocking after triaging the 3 critical / 16 high findings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
